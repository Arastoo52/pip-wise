<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- Dark Navbar Container (#1e2026) with crisp rounded border -->
  <rect width="64" height="64" rx="14" fill="#1e2026"/>
  <rect x="0.5" y="0.5" width="63" height="63" rx="13.5" stroke="rgba(255, 255, 255, 0.09)" fill="none"/>

  <!-- Candlestick Bar 1: Left (Orange #fc5d21, Height: 26.5px) -->
  <rect x="9.5" y="27.5" width="11" height="26.5" rx="5.5" fill="#fc5d21"/>

  <!-- Candlestick Bar 2: Center (Crisp White #ffffff, Height: 43px) -->
  <rect x="26.5" y="11" width="11" height="43" rx="5.5" fill="#ffffff"/>

  <!-- Candlestick Bar 3: Right (Orange #fc5d21, Height: 35px) -->
  <rect x="43.5" y="19" width="11" height="35" rx="5.5" fill="#fc5d21"/>
</svg>